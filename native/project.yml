name: ChimeraMac
packages:
  StreamQuilt:
    url: https://github.com/Jup33Q/streamquilt.git
    branch: main
options:
  bundleIdPrefix: org.chimera
  deploymentTarget:
    macOS: "14.0"
templates:
  NativeApp:
    type: application
    platform: macOS
    settings:
      base:
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: ChimeraMac/Bridge/ChimeraBridge.h
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../target/release"
        OTHER_LDFLAGS: "$(inherited) -lchimera_wasm"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT"
        CODE_SIGNING_ALLOWED: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    resources:
      - path: ../public/fonts/AVHersheySimplexLight.otf
      - path: ../public/fonts/AVHERSHEY-LICENSE.txt
      - path: ../public/data/CMUDICT-LICENSE.txt
    preBuildScripts: &BuildRustEngine
      - name: Build Rust engine
        shell: /bin/bash
        alwaysRun: true
        script: |
          set -e
          cd "$SRCROOT/.."
          if [ -x "$HOME/.cargo/bin/cargo" ]; then
            CARGO="$HOME/.cargo/bin/cargo"
          else
            CARGO="$(command -v cargo)"
          fi
          "$CARGO" build --release -p chimera-wasm --lib
    postBuildScripts: &CopyPronunciationDictionary
      - name: Copy pronunciation dictionary
        shell: /bin/bash
        script: |
          set -e
          mkdir -p "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH"
          gzip -dc "$SRCROOT/../public/data/cmudict.txt.gz" > "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/cmudict.txt"
        inputFiles:
          - $(SRCROOT)/../public/data/cmudict.txt.gz
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/cmudict.txt
targets:
  ChimeraMac:
    templates: [NativeApp]
    preBuildScripts: *BuildRustEngine
    postBuildScripts: *CopyPronunciationDictionary
    type: application
    platform: macOS
    sources:
      - path: ChimeraMac
        excludes:
          - Apps/**/*
      - path: ../public/data/cmudict.txt.gz
    settings:
      base:
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: ChimeraMac/Bridge/ChimeraBridge.h
        LIBRARY_SEARCH_PATHS: "$(SRCROOT)/../target/release"
        OTHER_LDFLAGS: "$(inherited) -lchimera_wasm"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: "MIT"
        CODE_SIGNING_ALLOWED: NO
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_BUNDLE_IDENTIFIER: org.chimera.vocal-synth
        PRODUCT_NAME: Chimera
  ChimeraPlay:
    templates: [NativeApp]
    preBuildScripts: *BuildRustEngine
    postBuildScripts: *CopyPronunciationDictionary
    type: application
    platform: macOS
    sources:
      - path: ChimeraMac/Engine
      - path: ../public/data/cmudict.txt.gz
      - path: ChimeraMac/MCP
      - path: ChimeraMac/Views/Components.swift
      - path: ChimeraMac/Views/VowelMapView.swift
      - path: ChimeraMac/Apps/Play
